<!DOCTYPE html>
<html><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Hide and Snipe</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#000;font-family:system-ui,sans-serif;touch-action:none;user-select:none;-webkit-user-select:none}
canvas{display:block;width:100vw;height:100vh}
.btn{position:fixed;bottom:24px;width:88px;height:88px;border-radius:50%;border:3px solid rgba(255,255,255,.75);color:#fff;font-weight:700;font-size:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(0,0,0,.35);z-index:3}
#zoomBtn{left:24px}#fireBtn{right:24px;background:rgba(200,40,30,.55)}
#zoomBtn small{font-size:10px;opacity:.8;font-weight:400}
#hud{position:fixed;top:10px;left:50%;transform:translateX(-50%);width:36%;height:10px;border:2px solid #fff;border-radius:6px;overflow:hidden;z-index:3}
#bar{height:100%;width:0;background:linear-gradient(90deg,#fc0,#f30)}
#zl{position:fixed;top:28px;left:50%;transform:translateX(-50%);color:#fff;font-size:12px;opacity:.85;z-index:3}
.ov{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(0,0,0,.75);color:#fff;text-align:center;z-index:5;padding:20px}
.ov h1{margin:0 0 8px}.ov p{max-width:520px}
.ov button{font-size:20px;padding:12px 30px;border:0;border-radius:10px;background:#f80;color:#fff;font-weight:700}
#rot{display:none;z-index:9}
@media (orientation:portrait){#rot{display:flex}}
</style></head><body>
<canvas id="c"></canvas>
<div id="hud"><div id="bar"></div></div><div id="zl">1x</div>
<div class="btn" id="zoomBtn">ZOOM<small>tap / swipe ↑↓</small></div>
<div class="btn" id="fireBtn">FIRE</div>
<div class="ov" id="menu"><h1>Hide and Snipe</h1>
<p id="msg">A sniper in camo is hiding behind one of the cacti, popping out now and then.<br>Hold your phone sideways. Move it to aim. Left thumb zooms (tap or swipe up to zoom in, swipe down to zoom out). Right thumb fires.</p>
<button id="start">Start</button></div>
<div class="ov" id="rot"><h1>↻</h1><p>Turn your phone sideways</p></div>
<script>
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
let W,H,DPR;function rs(){DPR=devicePixelRatio||1;W=innerWidth;H=innerHeight;cv.width=W*DPR;cv.height=H*DPR}
addEventListener('resize',rs);rs();
const WW=3200,WH=1100,HZ=430,ZOOMS=[1,2.5,5];
let seed=1;function rnd(){seed=(seed*16807)%2147483647;return seed/2147483647}
function groundY(x){return HZ+60+40*Math.sin(x/400)+25*Math.sin(x/170+1)}
let props=[],enemy={},cx=WW/2,cy=650,tx=cx,ty=cy,zoom=1,zi=0,exp=0,playing=false,flash=0;
function build(){
 seed=Math.floor(Math.random()*1e6)+1;props=[];
 for(let i=0;i<75;i++){let x=rnd()*WW,gy=groundY(x),y=gy+20+rnd()*(WH-gy-140),d=(y-HZ)/(WH-HZ),t=rnd();
  props.push({x,y,s:.45+d*1.1,type:t<.45?'cactus':t<.75?'rock':'bush',v:rnd()})}
 props.sort((a,b)=>a.y-b.y);
 const cs=props.filter(p=>p.type=='cactus'&&p.x>400&&p.x<WW-400);
 enemy={c:cs[Math.floor(Math.random()*cs.length)],side:Math.random()<.5?-1:1,peek:0,target:0,t:2,glint:0,gt:3,down:false,fall:0};
}
function rr(x,y,w,h,r){ctx.beginPath();ctx.roundRect(x,y,w,h,r);ctx.fill()}
function drawProp(p){const s=p.s,x=p.x,y=p.y;
 if(p.type=='cactus'){ctx.fillStyle=`hsl(${95+p.v*20},35%,${30+p.v*8}%)`;
  rr(x-6*s,y-70*s,12*s,70*s,6*s);
  rr(x-19*s,y-40*s,15*s,6*s,3*s);rr(x-19*s,y-58*s,6*s,24*s,3*s);
  if(p.v>.3){rr(x+4*s,y-48*s,15*s,6*s,3*s);rr(x+13*s,y-64*s,6*s,22*s,3*s)}}
 else if(p.type=='rock'){ctx.fillStyle=`hsl(30,15%,${45+p.v*15}%)`;ctx.beginPath();ctx.ellipse(x,y-8*s,(14+p.v*10)*s,(9+p.v*5)*s,0,0,7);ctx.fill()}
 else{ctx.fillStyle=`hsl(${70+p.v*20},25%,38%)`;for(let k=0;k<4;k++){ctx.beginPath();ctx.arc(x+(k-1.5)*7*s,y-7*s-(k%2)*4*s,8*s,0,7);ctx.fill()}}
}
function soldierPos(){const c=enemy.c,s=c.s,lean=(3+11*enemy.peek)*s;return{s,hx:c.x+enemy.side*lean,base:c.y}}
function drawEnemy(){const {s,hx,base}=soldierPos(),sd=enemy.side;
 ctx.save();ctx.translate(hx,base);ctx.rotate(sd*enemy.fall);
 ctx.fillStyle='#7c7f4a';rr(-6*s,-26*s,12*s,22*s,4*s);
 ctx.fillStyle='#5f6638';ctx.beginPath();ctx.arc(-2*s,-20*s,3*s,0,7);ctx.arc(3*s,-12*s,2.5*s,0,7);ctx.fill();
 ctx.fillStyle='#8a8a55';ctx.beginPath();ctx.arc(0,-31*s,5*s,0,7);ctx.fill();
 ctx.fillStyle='#5f6638';ctx.beginPath();ctx.arc(0,-33*s,5.4*s,Math.PI,0);ctx.fill();
 ctx.strokeStyle='#3a3a2a';ctx.lineWidth=2*s;ctx.beginPath();ctx.moveTo(sd*2*s,-25*s);ctx.lineTo(sd*(2+16*enemy.peek)*s,-25*s);ctx.stroke();
 if(enemy.glint>0&&enemy.peek>.6&&!enemy.down){const a=.12+.65*Math.min(1,(zoom-1)/4);
  const g=ctx.createRadialGradient(sd*8*s,-28*s,0,sd*8*s,-28*s,3.5*s);g.addColorStop(0,`rgba(255,255,240,${a})`);g.addColorStop(1,'rgba(255,255,240,0)');
  ctx.fillStyle=g;ctx.beginPath();ctx.arc(sd*8*s,-28*s,3.5*s,0,7);ctx.fill()}
 ctx.restore()}
function hitTest(px,py){if(enemy.down)return false;const {s,hx,base}=soldierPos(),c=enemy.c;
 if(Math.abs(px-c.x)<6*s&&py>base-70*s)return false;
 const head=Math.hypot(px-hx,py-(base-31*s))<5.5*s,body=Math.abs(px-hx)<6*s&&py>base-26*s&&py<base-4*s;return head||body}
function draw(){
 ctx.setTransform(DPR*zoom,0,0,DPR*zoom,DPR*(W/2-cx*zoom),DPR*(H/2-cy*zoom));
 let g=ctx.createLinearGradient(0,-400,0,HZ);g.addColorStop(0,'#5d9bd6');g.addColorStop(1,'#f3d9a8');ctx.fillStyle=g;ctx.fillRect(-800,-800,WW+1600,HZ+800);
 ctx.fillStyle='#b98e6a';ctx.beginPath();ctx.moveTo(-800,HZ);for(let x=-800;x<=WW+800;x+=60)ctx.lineTo(x,HZ-60-50*Math.abs(Math.sin(x/310))-30*Math.sin(x/130));ctx.lineTo(WW+800,HZ);ctx.fill();
 ctx.fillStyle='#d9b57e';ctx.fillRect(-800,HZ,WW+1600,WH+800);
 ctx.fillStyle='#caa26b';ctx.beginPath();ctx.moveTo(-800,WH+800);for(let x=-800;x<=WW+800;x+=40)ctx.lineTo(x,groundY(x));ctx.lineTo(WW+800,WH+800);ctx.fill();
 for(const p of props){if(p===enemy.c)drawEnemy();drawProp(p)}
 ctx.setTransform(DPR,0,0,DPR,0,0);
 const a=Math.min(1,Math.max(0,(zoom-1.1)/1.2));
 if(a>0){const r=Math.min(W,H)*.46;ctx.fillStyle=`rgba(0,0,0,${.5*a})`;ctx.beginPath();ctx.rect(0,0,W,H);ctx.arc(W/2,H/2,r,0,7,true);ctx.fill('evenodd');
  ctx.strokeStyle=`rgba(0,0,0,${.8*a})`;ctx.lineWidth=4;ctx.beginPath();ctx.arc(W/2,H/2,r,0,7);ctx.stroke()}
 ctx.strokeStyle='rgba(0,0,0,.8)';ctx.lineWidth=1.5;const L=a>0?Math.min(W,H)*.44:14;
 ctx.beginPath();ctx.moveTo(W/2-L,H/2);ctx.lineTo(W/2-4,H/2);ctx.moveTo(W/2+4,H/2);ctx.lineTo(W/2+L,H/2);ctx.moveTo(W/2,H/2-L);ctx.lineTo(W/2,H/2-4);ctx.moveTo(W/2,H/2+4);ctx.lineTo(W/2,H/2+L);ctx.stroke();
 ctx.fillStyle='rgba(255,0,0,.8)';ctx.beginPath();ctx.arc(W/2,H/2,1.5,0,7);ctx.fill();
 if(flash>0){ctx.fillStyle=`rgba(255,240,200,${flash*2})`;ctx.fillRect(0,0,W,H)}
}
let last=performance.now();
function loop(now){const dt=Math.min(.05,(now-last)/1000);last=now;
 zoom+=(ZOOMS[zi]-zoom)*(1-Math.exp(-dt*2.2));
 tx=Math.max(0,Math.min(WW,tx));ty=Math.max(HZ-150,Math.min(WH-60,ty));
 const glide=14/zoom;cx+=(tx-cx)*(1-Math.exp(-dt*glide));cy+=(ty-cy)*(1-Math.exp(-dt*glide));
 if(playing){
  enemy.t-=dt;if(enemy.t<=0){enemy.target=enemy.target?0:1;enemy.t=enemy.target?2+Math.random()*2:2.5+Math.random()*3}
  enemy.peek+=(enemy.target-enemy.peek)*(1-Math.exp(-dt*4));
  enemy.gt-=dt;if(enemy.gt<=0){enemy.glint=.15;enemy.gt=3+Math.random()*3}if(enemy.glint>0)enemy.glint-=dt;
  exp+=dt*(zoom>1.5?.04:.012);document.getElementById('bar').style.width=Math.min(100,exp*100)+'%';
  if(exp>=1)end(false)}
 if(enemy.down&&enemy.fall<1.5)enemy.fall+=dt*3;
 if(flash>0)flash-=dt;
 draw();requestAnimationFrame(loop)}
function setZoom(i){zi=Math.max(0,Math.min(2,i));document.getElementById('zl').textContent=ZOOMS[zi]+'x'}
const zb=document.getElementById('zoomBtn');let zy=0;
zb.addEventListener('pointerdown',e=>{e.preventDefault();e.stopPropagation();zy=e.clientY});
zb.addEventListener('pointerup',e=>{e.preventDefault();e.stopPropagation();const d=e.clientY-zy;
 if(d<-25)setZoom(zi+1);else if(d>25)setZoom(zi-1);else setZoom(zi==2?0:zi+1)});
document.getElementById('fireBtn').addEventListener('pointerdown',e=>{e.preventDefault();e.stopPropagation();if(!playing)return;
 flash=.08;if(hitTest(cx,cy)){enemy.down=true;playing=false;setTimeout(()=>end(true),1200)}else exp+=.18});
let drag=null;
cv.addEventListener('pointerdown',e=>drag={x:e.clientX,y:e.clientY});
addEventListener('pointermove',e=>{if(!drag)return;const dx=(e.clientX-drag.x)/zoom,dy=(e.clientY-drag.y)/zoom;tx-=dx;ty-=dy;cx-=dx;cy-=dy;drag={x:e.clientX,y:e.clientY}});
addEventListener('pointerup',()=>drag=null);
addEventListener('keydown',e=>{if(e.code=='Space')document.getElementById('fireBtn').dispatchEvent(new PointerEvent('pointerdown'));if(e.key=='z')setZoom(zi==2?0:zi+1)});
function onMotion(e){if(!playing||!e.rotationRate)return;
 const ang=(screen.orientation&&screen.orientation.angle)||window.orientation||0,sg=ang==90?1:-1;
 const dt=(e.interval>1?e.interval/1000:e.interval)||.016,k=18/zoom,dz=1.2*zoom;
 let b=e.rotationRate.beta||0,g=e.rotationRate.gamma||0;
 if(Math.abs(b)<dz)b=0;if(Math.abs(g)<dz)g=0;
 tx-=sg*b*k*dt;ty+=sg*g*k*dt}
function end(win){playing=false;document.getElementById('menu').style.display='flex';
 document.querySelector('#menu h1').textContent=win?'Target down!':'You got sniped!';
 document.getElementById('msg').textContent=win?'Nice shooting. Fancy another round?':'They spotted you first. Try again?';
 document.getElementById('start').textContent='Play again'}
document.getElementById('start').onclick=async()=>{
 try{if(typeof DeviceMotionEvent!='undefined'&&DeviceMotionEvent.requestPermission)await DeviceMotionEvent.requestPermission()}catch(e){}
 try{await document.documentElement.requestFullscreen();await screen.orientation.lock('landscape')}catch(e){}
 addEventListener('devicemotion',onMotion);
 build();exp=0;setZoom(0);cx=tx=WW/2;cy=ty=650;playing=true;document.getElementById('menu').style.display='none'};
build();requestAnimationFrame(loop);
</script></body></html>
